<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Education and IndiaFOSS mapping</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#faf9f5; --card:#fff; --card2:#f4f2ec; --ink:#1f1f1d; --ink2:#5f5e5a; --ink3:#8b8a83;
  --line:#e3e1d8; --line2:#cfcdc2; --accent:#3d6bd6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1a18; --card:#232320; --card2:#2b2b27; --ink:#f0eee6; --ink2:#b3b1a8; --ink3:#86847d;
    --line:#35342f; --line2:#46453f; --accent:#7ba4f0;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1a18; --card:#232320; --card2:#2b2b27; --ink:#f0eee6; --ink2:#b3b1a8; --ink3:#86847d;
  --line:#35342f; --line2:#46453f; --accent:#7ba4f0;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 56px}

header h1{font-size:23px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
header p{color:var(--ink2);font-size:14px;margin:0 0 18px;max-width:64ch}

.stats{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 20px;padding:14px 18px;
  background:var(--card);border:1px solid var(--line);border-radius:12px}
.stat b{display:block;font-size:21px;font-weight:600;line-height:1.2}
.stat span{font-size:12.5px;color:var(--ink3)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{font:inherit;font-size:14.5px;font-weight:500;cursor:pointer;color:var(--ink2);
  background:none;border:none;border-bottom:2px solid transparent;
  padding:9px 15px;margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px 6px 0 0}
[hidden]{display:none !important}

.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1 1 260px;min-width:200px}
.search input{width:100%;padding:9px 13px;font:inherit;font-size:14px;color:var(--ink);
  background:var(--card);border:1px solid var(--line2);border-radius:9px}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
/* .chip{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;
  border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:999px;
  padding:6px 13px;font:inherit;font-size:13px;line-height:1.3;transition:opacity .15s}
.chip.off{opacity:.36}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip.all{border-style:dashed;color:var(--ink2)} */

.cols{display:flex;gap:18px;align-items:flex-start}
.left{flex:1 1 520px;min-width:0}
.right{flex:0 1 330px;min-width:270px;position:sticky;top:12px}
@media (max-width:860px){ .cols{flex-direction:column} .right{position:static;width:100%;flex-basis:auto} }

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;
  cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;
  transition:border-color .15s,box-shadow .15s}
.pcard:hover{border-color:var(--line2);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.pcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pcard.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pcard .top{display:flex;gap:11px;align-items:flex-start}
.av{width:36px;height:36px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-size:13px;font-weight:600;color:#fff;letter-spacing:.02em}
.pname{font-size:15px;font-weight:600;line-height:1.3}
.prole{font-size:12.5px;color:var(--ink2);margin-top:1px}
.porg{font-size:12.5px;color:var(--ink3);margin-top:1px}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;
  padding-top:10px;border-top:1px solid var(--line)}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;display:block}
.nconn{font-size:12px;color:var(--ink3)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel .ptop{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.panel h2{font-size:17px;font-weight:600;margin:0;line-height:1.25}
.panel .psub{font-size:13px;color:var(--ink2);margin-top:2px}
.meta{border-top:1px solid var(--line);padding:9px 0;display:flex;gap:10px;font-size:13px}
.meta dt{flex:0 0 78px;color:var(--ink3)}
.meta dd{margin:0;flex:1;min-width:0;word-break:break-word}
.subhead{font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.05em;
  text-transform:uppercase;margin:16px 0 6px}
.conn{border-top:1px solid var(--line);padding:9px 0}
.conn .who{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.conn .who .dot{width:8px;height:8px;border-radius:50%;flex:none}
.conn .what{font-size:12.5px;color:var(--ink2);margin-top:1px}
.empty{color:var(--ink3);font-size:13.5px}
.closebtn{flex:none;margin:-3px -4px 0 auto;width:28px;height:28px;display:grid;place-items:center;
  font:inherit;font-size:17px;line-height:1;cursor:pointer;color:var(--ink3);
  background:none;border:none;border-radius:7px;transition:background .15s,color .15s}
.closebtn:hover{background:var(--card2);color:var(--ink)}
.closebtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.graphbox{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
svg{display:block;width:100%;height:auto;touch-action:manipulation}
.node circle{cursor:pointer;stroke-width:1.5}
.node text{font-size:11.5px;fill:var(--ink);pointer-events:none;paint-order:stroke;
  stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.dim{opacity:.1}
.foot{color:var(--ink3);font-size:13px;margin-top:14px}
.note{color:var(--ink3);font-size:12.5px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Education and IndiaFOSS mapping</h1>
  <p>People working on free and open source software in Indian education, and the collaborations between them. Select anyone in either view to see their profile and connections.</p>
</header>

<!-- <div class="stats" id="stats"></div> -->

<div class="tabs" role="tablist" aria-label="Views">
  <button class="tab" role="tab" id="tab-dir" aria-controls="view-dir" aria-selected="false">Directory</button>
  <button class="tab" role="tab" id="tab-net" aria-controls="view-net" aria-selected="true">Network</button>
</div>

<div class="cols">
  <div class="left">

    <div id="view-net" role="tabpanel" aria-labelledby="tab-net">
      <!-- <div class="controls" id="legend"></div> -->
      <div class="graphbox">
        <svg id="g" viewBox="0 0 720 620" role="img" aria-label="Network diagram of collaborations"></svg>
      </div>
      <p class="foot" id="count"></p>
      <p class="note" id="gaps"></p>
    </div>

    <div id="view-dir" role="tabpanel" aria-labelledby="tab-dir" hidden>
      <div class="controls">
        <div class="search"><input id="q" type="search" placeholder="Search name, role or organisation" autocomplete="off" aria-label="Search the directory"></div>
      </div>
      <div class="grid" id="grid"></div>
      <p class="foot" id="dirCount"></p>
    </div>

  </div>
  <aside class="right">
    <div class="panel" id="panel"></div>
  </aside>
</div>

</div>

<script src="d3.min.js"></script>
<script>
const THEMES={
  osai:{label:"Open source AI in education",color:"#7F77DD"},
  grafana:{label:"Grafana Learn and FOSDEM",color:"#1D9E75"},
  b4b:{label:"Build for Bharat Fellowship",color:"#D85A30"},
  schools:{label:"Government schools",color:"#378ADD"},
  tooling:{label:"Open source tooling",color:"#BA7517"},
  curric:{label:"Curriculum",color:"#D4537E"},
  regional:{label:"Regional and networking",color:"#639922"},
  intro:{label:"Introduced, no topic yet",color:"#888780"}
};

const P=[
 {id:"Chandra R",role:"Head of Technology",org:"IT For Change",li:"",web:"https://itforchange.net/"},
 {id:"Saket Choudhary",role:"Assistant Professor, Koita Centre for Digital Health",org:"IIT Bombay",li:"https://www.linkedin.com/in/saket-choudhary/",web:"https://www.kcdh.iitb.ac.in/"},
 {id:"Mohit P Tahiliani",role:"Associate Professor",org:"NITK Surathkal / COSH",li:"https://in.linkedin.com/in/mohittahiliani",web:"https://cosh.nitk.ac.in/about"},
 {id:"Hussain Nagaria",role:"Founder",org:"CS17 / BWH",li:"https://linkedin.com/in/buildwithhussain",web:"https://cs17.org/"},
 {id:"Dr. Sunil TT",role:"Director",org:"ICFOSS",li:"https://www.linkedin.com/in/vu2swx/",web:"https://icfoss.in/"},
 {id:"Rinsa",role:"Co-founder and CEO",org:"TinkerQubits",li:"https://www.linkedin.com/in/rinsa-perapadan-64200029/",web:"https://www.tinkerqubits.org/"},
 {id:"Ankit",role:"Coordinator",org:"Open Knowledge Initiatives",li:"https://www.linkedin.com/in/ankit-kumar-verma-081804160/",web:"https://meta.wikimedia.org/wiki/IIITH-OKI"},
 {id:"KC Sivaramakrishnan",role:"Assistant Professor",org:"IIT Madras / FP Launchpad",li:"https://www.linkedin.com/in/kc-sivaramakrishnan-25061a14/",web:"https://fplaunchpad.org/"},
 {id:"Aaditeshwar Seth",role:"Professor",org:"IIT Delhi / CoRE Stack",li:"https://www.linkedin.com/in/aaditeshwarseth/",web:"https://core-stack.org/"},
 {id:"James Reilly",role:"",org:"Lucknow Community",li:"https://in.linkedin.com/in/jreilly112",web:""},
 {id:"Praveen Das",role:"Lead Partnerships Manager, South Asia",org:"Wikimedia Foundation",li:"https://www.linkedin.com/in/praveen-das-pdas/",web:"https://wikimediafoundation.org/"},
 {id:"Jibu Elias",role:"Lead, Responsible Computing Challenge in India",org:"Mozilla Foundation",li:"https://www.linkedin.com/in/jibuelias/",web:"https://www.mozillafoundation.org/en/"},
 {id:"Richard Hartmann",role:"Office of the CTO",org:"Grafana Labs",li:"https://www.linkedin.com/in/richih/",web:"https://grafana.com/docs/learning-hub/"},
 {id:"Vishal Arya",role:"Founder",org:"Bodhya",li:"https://linkedin.com/in/fossdot",web:"https://bodhya.net/"},
 {id:"Harsh Nisar",role:"Co-founder",org:"Bharat Digital",li:"https://in.linkedin.com/in/harsh-nisar-b8347588",web:"https://www.bharatdigital.io/fellowship"}
];
const byId=Object.fromEntries(P.map(p=>[p.id,p]));

const E=[
["Chandra R","Jibu Elias","osai","Talk about Open source AI in education."],
["Saket Choudhary","Jibu Elias","osai","Talk about Open source AI in education."],
["Mohit P Tahiliani","Jibu Elias","osai","Talk about Open source AI in education."],
["Ankit","Jibu Elias","osai","Talk about Open source AI in education."],
["KC Sivaramakrishnan","Jibu Elias","osai","Talk about Open source AI in education."],
["Aaditeshwar Seth","Jibu Elias","osai","Talk about Open source AI in education."],
["Saket Choudhary","Richard Hartmann","grafana","Talk about Grafana Learn and other events such as FOSDEM."],
["Mohit P Tahiliani","Richard Hartmann","grafana","Talk about Grafana Learn and events such as FOSDEM. "],
["Dr. Sunil TT","Richard Hartmann","grafana","Talk about Grafana Learn and events such as FOSDEM. "],
["Ankit","Richard Hartmann","grafana","Talk about Grafana Learn and events such as FOSDEM."],
["KC Sivaramakrishnan","Richard Hartmann","grafana","Talk about Grafana Learn and events such as FOSDEM. "],
["Aaditeshwar Seth","Richard Hartmann","grafana","Talk about Grafana Learn and events such as FOSDEM. "],
["James Reilly","Richard Hartmann","grafana","Talk about Grafana Learn and events such as FOSDEM. "],
["Saket Choudhary","Harsh Nisar","b4b","Talk about sending your students to Build for Bharat Fellowship"],
["Mohit P Tahiliani","Harsh Nisar","b4b","Talk about sending your students to Build for Bharat Fellowship"],
["KC Sivaramakrishnan","Harsh Nisar","b4b","Talk about sending your students to Build for Bharat Fellowship"],
["Aaditeshwar Seth","Harsh Nisar","b4b","Talk about sending your students to Build for Bharat Fellowship"],
["Jibu Elias","Harsh Nisar","b4b","Talk about the AIxSDLC workshop Bharat Digital runs for state governments and Bharat Digital Fellowship."],
["Praveen Das","Harsh Nisar","b4b","Wikimedia Foundations involvement in the Build for Bharat Fellowship and AIxSDLC workshop"],
["Chandra R","Hussain Nagaria","schools","Tools and programs for government schools and students."],
["Chandra R","Rinsa","schools","Tools and programs for government schools and students."],
["Chandra R","Dr. Sunil TT","schools","Tools and programs for government schools and students."],
["Chandra R","Praveen Das","schools","School programms such as Schoolwiki."],
["Saket Choudhary","Mohit P Tahiliani","tooling","Collaborative project building and student exchange"],
["Saket Choudhary","KC Sivaramakrishnan","tooling","Collaborative project building and student exchange"],
["Saket Choudhary","Aaditeshwar Seth","tooling","Collaborative project building and student exchange"],
["Mohit P Tahiliani","KC Sivaramakrishnan","tooling","Collaborative project building and student exchange"],
["Saket Choudhary","James Reilly","tooling","Open source tooling, student mentoring and job pathways."],
["Saket Choudhary","Ankit","curric","Talk about curriculum work that Ankit is working on"],
["Mohit P Tahiliani","Ankit","curric","Talk about curriculum work that Ankit is working on"],
["Hussain Nagaria","Rinsa","curric","Talk about usage of open source tools for education and any curriculum work"],
["Chandra R","Mohit P Tahiliani","regional","Talk about your work in rural India (Karnataka)"],
["Saket Choudhary","Rinsa","regional","Good to connect as both of your work is in (or includes) Maharashtra"],
["Ankit","James Reilly","regional","Talk about both of your work in Uttar Pradesh with respect to education."],
["KC Sivaramakrishnan","Aaditeshwar Seth","intro","Collaborative project building and student exchange"]
];

const PAL=["#7F77DD","#1D9E75","#D85A30","#378ADD","#BA7517","#D4537E","#639922","#5c8c9e"];
function initials(n){const w=n.replace("Dr. ","").split(" ").filter(Boolean);
  return ((w[0]?.[0]||"")+(w[1]?.[0]||"")).toUpperCase()}
function hueOf(n){let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]}

const off=new Set();
let selected=null, query="";

const nodes=P.map(p=>({id:p.id}));
const links=E.map(([s,t,theme,text])=>({source:s,target:t,theme,text}));
const deg={};P.forEach(p=>deg[p.id]=0);
E.forEach(([s,t])=>{deg[s]++;deg[t]++});
const themesOf={};P.forEach(p=>themesOf[p.id]=new Set());
E.forEach(([s,t,th])=>{themesOf[s].add(th);themesOf[t].add(th)});

/* ---------- stats ---------- */
// document.getElementById("stats").innerHTML=
//   [[P.length,"people"],[E.length,"connections"],[Object.keys(THEMES).length,"themes"]]
//   .map(([b,s])=>`<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");

/* ---------- tabs ---------- */
const TABS=[["tab-net","view-net"],["tab-dir","view-dir"]];
function showTab(id){
  TABS.forEach(([t,v])=>{
    const on=t===id;
    document.getElementById(t).setAttribute("aria-selected",on);
    document.getElementById(v).hidden=!on;
  });
}
TABS.forEach(([t])=>{
  const el=document.getElementById(t);
  el.onclick=()=>showTab(t);
  el.onkeydown=e=>{
    if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;
    const i=TABS.findIndex(([x])=>x===t);
    const n=TABS[(i+(e.key==="ArrowRight"?1:TABS.length-1))%TABS.length][0];
    showTab(n); document.getElementById(n).focus();
  };
});

/* ---------- directory ---------- */
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.toLowerCase().trim();renderDir()});
function passes(p){ return !query || (p.id+" "+p.role+" "+p.org).toLowerCase().includes(query) }

function renderDir(){
  const list=P.filter(passes);
  document.getElementById("grid").innerHTML=list.map(p=>{
    const th=[...themesOf[p.id]].map(t=>`<i style="background:${THEMES[t].color}"></i>`).join("");
    return `<button class="pcard${selected===p.id?" sel":""}" data-id="${p.id}">
      <div class="top">
        <span class="av" style="background:${hueOf(p.id)}">${initials(p.id)}</span>
        <span style="min-width:0">
          <span class="pname">${p.id}</span>
          ${p.role?`<div class="prole">${p.role}</div>`:""}
          <div class="porg">${p.org||"Organisation not recorded"}</div>
        </span>
      </div>
      <div class="pfoot">
        <span class="dots">${th}</span>
        <span class="nconn">${deg[p.id]} link${deg[p.id]===1?"":"s"}</span>
      </div></button>`;
  }).join("") || `<p class="empty">No one matches that search.</p>`;
  document.querySelectorAll(".pcard").forEach(b=>b.onclick=()=>select(b.dataset.id));
  document.getElementById("dirCount").textContent=`Showing ${list.length} of ${P.length} people.`;
}

/* ---------- detail panel ---------- */
function renderPanel(){
  const el=document.getElementById("panel");
  if(!selected){
    el.innerHTML=`<h2>Nobody selected</h2>
  <p class="psub">Select anyone in either view to see their role, links and collaborations. Checkout Directory to know everyone.</p>`;    
  return;
  }
  const p=byId[selected];
  const vis=links.filter(l=>!off.has(l.theme));
  const mine=vis.filter(l=>l.source.id===selected||l.target.id===selected);
  const short=u=>u.replace(/^https?:\/\//,"").replace(/\/$/,"");
  const rows=[];
  if(p.org) rows.push(["Org",p.org]);
  if(p.role) rows.push(["Role",p.role]);
  if(p.li) rows.push(["LinkedIn",`<a href="${p.li}" target="_blank" rel="noopener">${short(p.li)}</a>`]);
  if(p.web) rows.push(["Open source",`<a href="${p.web}" target="_blank" rel="noopener">${short(p.web)}</a>`]);
  if(!rows.length) rows.push(["Details",`<span class="empty">Not recorded yet</span>`]);
  el.innerHTML=`
    <div class="ptop">
      <span class="av" style="background:${hueOf(p.id)}">${initials(p.id)}</span>
      <span style="min-width:0"><h2>${p.id}</h2>
      <div class="psub">${[p.role,p.org].filter(Boolean).join(" · ")||"Details not recorded"}</div></span>
      <button class="closebtn" id="clr" title="Clear selection" aria-label="Clear selection">&times;</button>
    </div>
    <dl style="margin:0">${rows.map(([k,v])=>`<div class="meta"><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    <div class="subhead">${mine.length} connection${mine.length===1?"":"s"}</div>
    ${mine.map(l=>{
      const o=l.source.id===selected?l.target.id:l.source.id;
      return `<div class="conn"><div class="who"><span class="dot" style="background:${THEMES[l.theme].color}"></span>${o}</div><div class="what">${l.text}</div></div>`;
    }).join("")||`<p class="empty">No connections in the visible themes.</p>`}`;
  document.getElementById("clr").onclick=()=>select(null);
}

function select(id){
  selected=(id&&selected===id)?null:id;
  renderDir(); renderPanel(); renderNet();
  if(selected&&window.matchMedia("(max-width:860px)").matches)
    document.getElementById("panel").scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ---------- network ---------- */
const svg=d3.select("#g"), W=720, H=620;
const link=svg.append("g").selectAll("line").data(links).join("line")
  .attr("stroke",d=>THEMES[d.theme].color).attr("stroke-width",1.4).attr("stroke-opacity",.55);
const node=svg.append("g").selectAll("g").data(nodes).join("g").attr("class","node")
  .on("click",(e,d)=>select(d.id));
node.append("circle").attr("r",d=>6+Math.min(deg[d.id],8)*.9)
  .attr("fill",d=>hueOf(d.id)).attr("fill-opacity",.9).attr("stroke","var(--card)");
node.append("text").attr("text-anchor","middle")
  .attr("dy",d=>-(10+Math.min(deg[d.id],8)*.9))
  .text(d=>d.id.replace("Dr. ","").split(" ").slice(0,2).join(" "));

const sim=d3.forceSimulation(nodes)
  .force("link",d3.forceLink(links).id(d=>d.id).distance(110).strength(.35))
  .force("charge",d3.forceManyBody().strength(-620))
  .force("center",d3.forceCenter(W/2,H/2))
  .force("collide",d3.forceCollide(48))
  .on("tick",()=>{
    nodes.forEach(d=>{d.x=Math.max(60,Math.min(W-60,d.x));d.y=Math.max(34,Math.min(H-24,d.y))});
    link.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    node.attr("transform",d=>`translate(${d.x},${d.y})`);
  });
node.call(d3.drag()
  .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y})
  .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y})
  .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));

function renderNet(){
  const vis=links.filter(l=>!off.has(l.theme));
  link.style("display",d=>off.has(d.theme)?"none":null);
  const near=new Set();
  if(selected){near.add(selected);
    vis.forEach(l=>{if(l.source.id===selected)near.add(l.target.id);if(l.target.id===selected)near.add(l.source.id)})}
  node.classed("dim",d=>selected?!near.has(d.id):false);
  link.classed("dim",d=>selected?(d.source.id!==selected&&d.target.id!==selected):false);
  document.getElementById("count").textContent=`${vis.length} of ${links.length} connections shown.`;
}
